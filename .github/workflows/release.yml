name: Build and release

# The desktop app checks GitHub Releases for updates, so every tagged version
# needs an AutoBOM.exe asset attached to its release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pyinstaller --noconfirm packaging/autobom.spec
      - name: Check the executable starts
        run: dist\AutoBOM.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: AutoBOM-windows
          path: dist/AutoBOM.exe

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AutoBOM-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: AutoBOM.exe
          generate_release_notes: true
