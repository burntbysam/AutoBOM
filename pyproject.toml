[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autobom"
dynamic = ["version"]
description = "CNC sheet metal BOM processor for bus section BOMs and indented lists"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
autobom = "autobom.cli:main"

[project.gui-scripts]
autobom-gui = "autobom.gui.app:main"

[tool.setuptools]
packages = ["autobom", "autobom.core", "autobom.gui", "autobom.updater"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
